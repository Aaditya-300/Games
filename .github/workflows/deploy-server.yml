name: Deploy server to Render

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'render.yaml'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set. Add it in Settings > Secrets and variables > Actions (copy the deploy hook URL from the uno-server service's Settings tab on Render)."
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
