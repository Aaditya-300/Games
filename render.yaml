services:
  - type: web
    name: uno-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CORS_ORIGINS
        value: https://uno-client.onrender.com,https://aaditya-300.github.io

  - type: web
    name: uno-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SERVER_URL
        value: https://uno-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
