<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>UNO Online</title>
    <script>
      // GitHub Pages has no server-side routing, so deep links 404.
      // Redirect back to the app root and let the client router take over.
      sessionStorage.redirect = location.href;
      var base = '/Games/';
      location.replace(base);
    </script>
  </head>
  <body></body>
</html>
